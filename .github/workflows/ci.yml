name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@10.4.1+sha512...)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No ESLint in this repo. `pnpm check` (tsc --noEmit) is the quality gate.
      # Prettier is present but the tree is not yet fully formatted; do not gate CI on it yet.
      - name: Lint
        run: pnpm check

      # gemini.test.ts and tts.test.ts need GEMINI_API_KEY and hit external APIs.
      # Keep them out of the default required CI path until secrets + optional job exist.
      - name: Test
        run: >-
          pnpm exec vitest run
          --exclude server/gemini.test.ts
          --exclude server/tts.test.ts

      - name: Build
        run: pnpm build